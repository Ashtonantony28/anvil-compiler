[project]
name = "anvil"
version = "0.0.1"
description = "A tensor compiler that lowers PyTorch transformer blocks onto the tiny-gpu-extended ISA"
requires-python = ">=3.11"
dependencies = ["numpy", "xdsl==0.75.0"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "cocotb==2.0.1"]
torch = ["torch"]

[tool.setuptools.packages.find]
include = ["anvil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rtl: runs the RTL simulator (slow)", "torch: needs torch and NANOGPT_DIR"]
